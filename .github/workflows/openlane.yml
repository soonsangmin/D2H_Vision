name: OpenLane ASIC Flow

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build_gds:
    runs-on: ubuntu-22.04
    # Khai báo chạy toàn bộ các bước bên trong Docker image gốc của OpenLane
    container:
      image: ghcr.io/efabless/openlane2:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Bỏ qua bước Setup Python và cài đặt qua Pip
      
      - name: Run Full ASIC Flow
        run: |
          # Chạy lệnh gốc, KHÔNG sử dụng cờ --dockerized
          # OpenLane sẽ tự động gọi volare để tải Sky130 PDK nếu chưa có
          openlane config.json

      - name: Zip and Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openlane-results
          path: runs/
