name: OpenLane ASIC Flow

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build_gds:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OpenLane 2
        run: |
          python -m pip install --upgrade pip
          pip install openlane

      - name: Run Full ASIC Flow
        run: |
          # Lệnh này tự động kéo Docker image và tải Sky130 PDK qua volare
          openlane --dockerized config.json

      - name: Zip and Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openlane-results
          path: runs/
