name: V1.18 ASIC Physical Flow

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "ASIC flow stage to run"
        required: true
        type: choice
        default: synth
        options:
          - synth
          - gds

permissions:
  contents: read

concurrency:
  group: v118-asic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  asic-flow:
    # Pin Ubuntu 24.04 to avoid an unplanned OS-image change.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # Change this to the relative path if the ASIC source is in a subfolder,
      # for example: V118_ASIC_SOURCE
      ASIC_PROJECT_DIR: V118_ASIC_SOURCE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate ASIC source directory
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          requested="${ASIC_PROJECT_DIR:-.}"
          script_rel="scripts/run_v117_nearfull_gds.sh"

          if [[ -s "$requested/$script_rel" ]]; then
            selected="$requested"
          else
            mapfile -t found_scripts < <(find . -type f -path "*/$script_rel" -not -path './.git/*' -print | sort)
            if [[ ${#found_scripts[@]} -eq 1 ]]; then
              selected="${found_scripts[0]%/$script_rel}"
            elif [[ ${#found_scripts[@]} -eq 0 ]]; then
              # Also support committing the original source ZIP instead of
              # extracting V118_ASIC_SOURCE into the repository beforehand.
              mapfile -t source_archives < <(find . -maxdepth 4 -type f -iname 'V118_HandSeg_ASIC_SOURCE.zip' -not -path './.git/*' -print | sort)
              if [[ ${#source_archives[@]} -eq 1 ]]; then
                extract_root="$GITHUB_WORKSPACE/.ci_v118_source"
                mkdir -p "$extract_root"
                unzip -oq "${source_archives[0]}" -d "$extract_root"
                if [[ -s "$extract_root/V118_ASIC_SOURCE/$script_rel" ]]; then
                  selected="$extract_root/V118_ASIC_SOURCE"
                else
                  echo "[FAIL] Extracted source ZIP does not contain $script_rel"
                  find "$extract_root" -maxdepth 6 -type f -name 'run_v117_nearfull_gds.sh' -print || true
                  exit 1
                fi
              else
                echo "[FAIL] Cannot find $script_rel in the checked-out repository."
                echo "[INFO] Commit the extracted V118_ASIC_SOURCE folder, or add V118_HandSeg_ASIC_SOURCE.zip."
                echo "[INFO] Expected ./scripts/... or ./V118_ASIC_SOURCE/scripts/..."
                find . -maxdepth 5 -type f -name 'run_v117_nearfull_gds.sh' -print || true
                exit 1
              fi
            else
              printf '[FAIL] Multiple ASIC source trees found:\n'
              printf '  %s\n' "${found_scripts[@]}"
              echo "Set ASIC_PROJECT_DIR in this workflow to select one explicitly."
              exit 1
            fi
          fi

          # Keep the path relative to the checkout so later steps and
          # artifact upload use one unambiguous location.
          case "$selected" in
            "$GITHUB_WORKSPACE"/*) selected="${selected#"$GITHUB_WORKSPACE"/}" ;;
          esac
          echo "project_dir=$selected" >> "$GITHUB_OUTPUT"
          echo "[OK] ASIC source directory: $selected"

      - name: Check project layout and runner resources
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== SOURCE ROOT ==="
          pwd
          echo "=== SCRIPTS DIRECTORY ==="
          ls -la scripts || true
          echo "=== RUNNER SEARCH ==="
          find "$GITHUB_WORKSPACE" -maxdepth 7 -type f -name 'run_v117_nearfull_gds.sh' -print || true
          test -s scripts/run_v117_nearfull_gds.sh
          test -s scripts/v118_apply_fast_abc.py
          test -s scripts/v117_report.py
          test -s config/config_v117_nearfull_compute.mk
          test -s config/v118_synth_preamble.tcl
          test -s rtl/memory/v117_absent_memory_blackboxes.v
          test -s macros/sky130_1k/sky130_sram_1kbyte_1rw1r_32x256_8.lef
          test -s macros/sky130_1k/sky130_sram_1kbyte_1rw1r_32x256_8_TT_1p8V_25C.lib
          test -s macros/sky130_1k/sky130_sram_1kbyte_1rw1r_32x256_8.gds
          echo "=== CPU ==="
          nproc
          echo "=== MEMORY ==="
          free -h
          echo "=== DISK ==="
          df -h . "$RUNNER_TEMP"
          echo "=== DOCKER ==="
          docker version
          docker info

      - name: Prepare V1.18 for GitHub-hosted runner
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          # The uploaded V1.18 source archive references this ABC file,
          # but the file was absent from the archive. Recreate the intended
          # quick ABC mapping script (strash; map).
          mkdir -p config
          printf 'strash\nmap\n' > config/v118_abc_quick.script

          # V1.18's original runner used a WSL/Windows-specific /mnt/d path.
          # Replace it with the temporary directory provided by GitHub Actions.
          mkdir -p "$RUNNER_TEMP/ASIC_WORK/V118/tmp"
          python3 - <<'PY'
          from pathlib import Path
          import os

          runner = Path("scripts/run_v117_nearfull_gds.sh")
          source = runner.read_text()
          old = "/mnt/d/ASIC_WORK/V118/tmp"
          new = os.path.join(os.environ["RUNNER_TEMP"], "ASIC_WORK/V118/tmp")
          if old in source:
              source = source.replace(old, new)
              runner.write_text(source)
              print(f"[PATCH] Docker TMP mount: {old} -> {new}")
          elif new in source:
              print("[OK] Docker TMP mount already points to RUNNER_TEMP")
          else:
              raise SystemExit("[FAIL] Could not identify the V1.18 temporary-directory mount")
          PY

          # Apply the source-provided V1.18 ABC/timeout patch and verify it.
          python3 scripts/v118_apply_fast_abc.py
          grep -q 'export ABC_SCRIPT := /workspace/config/v118_abc_quick.script' config/config_v117_nearfull_compute.mk
          grep -q 'strash' config/v118_abc_quick.script
          grep -q '^map$' config/v118_abc_quick.script

      - name: Pull OpenROAD Flow Scripts image
        shell: bash
        run: |
          set -euo pipefail
          docker pull openroad/orfs:latest

      - name: Select flow mode
        id: mode
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          else
            mode="synth"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Selected ASIC flow mode: $mode"

      - name: Run V1.18 ASIC flow
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -o pipefail
          echo "[CI] Starting V1.18 flow: ${{ steps.mode.outputs.mode }}"
          bash scripts/run_v117_nearfull_gds.sh "${{ steps.mode.outputs.mode }}"

      - name: Add report to workflow summary
        if: always()
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          report="output/v117_nearfull/BAO_CAO_V117.md"
          status="output/v117_nearfull/status.txt"
          {
            echo "## V1.18 ASIC Flow"
            if [[ -s "$status" ]]; then
              echo "**Status:** \`$(cat "$status")\`"
            else
              echo "**Status:** no status file was generated"
            fi
            if [[ -s "$report" ]]; then
              cat "$report"
            else
              echo "The detailed Markdown report was not generated. Check the uploaded logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ASIC reports, logs, and physical outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v118-asic-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ steps.locate.outputs.project_dir }}/output/v117_nearfull/status.txt
            ${{ steps.locate.outputs.project_dir }}/output/v117_nearfull/BAO_CAO_V117.md
            ${{ steps.locate.outputs.project_dir }}/output/v117_nearfull/*.log
            ${{ steps.locate.outputs.project_dir }}/output/v117_nearfull/reports/**
            ${{ steps.locate.outputs.project_dir }}/output/v117_nearfull/logs/**
            ${{ steps.locate.outputs.project_dir }}/output/v117_nearfull/results/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
