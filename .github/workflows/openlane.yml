name: OpenLane ASIC Flow

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build_gds:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OpenLane Synthesis & Place-Route
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -v /dev/shm:/dev/shm \
            -w /work \
            efabless/openlane:current \
            bash -c "make fullchip"
            
      - name: Zip and Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openlane-results
          path: runs/
