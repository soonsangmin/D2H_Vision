name: OpenLane ASIC Flow

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build_gds:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Full ASIC Flow via Native Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            -e PDK_ROOT=/work/pdk \
            ghcr.io/efabless/openlane2:latest \
            bash -c "openlane config.json; EXIT_CODE=\$?; chown -R $(id -u):$(id -g) /work; exit \$EXIT_CODE"

      - name: Zip and Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openlane-results
          path: runs/
