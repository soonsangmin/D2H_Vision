name: V1.18 ASIC Physical Flow

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "ASIC flow stage to run"
        required: true
        type: choice
        default: synth
        options:
          - synth
          - gds

permissions:
  contents: read

concurrency:
  group: v118-asic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  asic-flow:
    # Pin Ubuntu 24.04 to avoid an unplanned OS-image change.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # Change this to the relative path if the ASIC source is in a subfolder,
      # for example: V118_ASIC_SOURCE
      ASIC_PROJECT_DIR: V118_ASIC_SOURCE
      ORFS_IMAGE: openroad/orfs:26Q4-244-g202c7fccb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Locate ASIC source directory
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          requested="${ASIC_PROJECT_DIR:-.}"
          script_rel="scripts/run_v117_nearfull_gds.sh"

          if [[ -s "$requested/$script_rel" ]]; then
            selected="$requested"
          else
            mapfile -t found_scripts < <(find . -type f -path "*/$script_rel" -not -path './.git/*' -print | sort)
            if [[ ${#found_scripts[@]} -eq 1 ]]; then
              selected="${found_scripts[0]%/$script_rel}"
            elif [[ ${#found_scripts[@]} -eq 0 ]]; then
              # Also support committing the original source ZIP instead of
              # extracting V118_ASIC_SOURCE into the repository beforehand.
              mapfile -t source_archives < <(find . -maxdepth 4 -type f -iname 'V118_HandSeg_ASIC_SOURCE.zip' -not -path './.git/*' -print | sort)
              if [[ ${#source_archives[@]} -eq 1 ]]; then
                extract_root="$GITHUB_WORKSPACE/.ci_v118_source"
                mkdir -p "$extract_root"
                unzip -oq "${source_archives[0]}" -d "$extract_root"
                if [[ -s "$extract_root/V118_ASIC_SOURCE/$script_rel" ]]; then
                  selected="$extract_root/V118_ASIC_SOURCE"
                else
                  echo "[FAIL] Extracted source ZIP does not contain $script_rel"
                  find "$extract_root" -maxdepth 6 -type f -name 'run_v117_nearfull_gds.sh' -print || true
                  exit 1
                fi
              else
                echo "[FAIL] Cannot find $script_rel in the checked-out repository."
                echo "[INFO] Commit the extracted V118_ASIC_SOURCE folder, or add V118_HandSeg_ASIC_SOURCE.zip."
                echo "[INFO] Expected ./scripts/... or ./V118_ASIC_SOURCE/scripts/..."
                find . -maxdepth 5 -type f -name 'run_v117_nearfull_gds.sh' -print || true
                exit 1
              fi
            else
              printf '[FAIL] Multiple ASIC source trees found:\n'
              printf '  %s\n' "${found_scripts[@]}"
              echo "Set ASIC_PROJECT_DIR in this workflow to select one explicitly."
              exit 1
            fi
          fi

          # Keep the path relative to the checkout so later steps and
          # artifact upload use one unambiguous location.
          case "$selected" in
            "$GITHUB_WORKSPACE"/*) selected="${selected#"$GITHUB_WORKSPACE"/}" ;;
          esac
          echo "project_dir=$selected" >> "$GITHUB_OUTPUT"
          echo "[OK] ASIC source directory: $selected"

      - name: Check project layout and runner resources
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== SOURCE ROOT ==="
          pwd
          echo "=== SCRIPTS DIRECTORY ==="
          ls -la scripts || true
          echo "=== RUNNER SEARCH ==="
          find "$GITHUB_WORKSPACE" -maxdepth 7 -type f -name 'run_v117_nearfull_gds.sh' -print || true
          test -s scripts/run_v117_nearfull_gds.sh
          test -s scripts/v118_apply_fast_abc.py
          test -s scripts/v117_report.py
          test -s config/config_v117_nearfull_compute.mk
          test -s config/v118_synth_preamble.tcl
          test -s rtl/memory/v117_absent_memory_blackboxes.v
          test -s macros/sky130_1k/sky130_sram_1kbyte_1rw1r_32x256_8.lef
          test -s macros/sky130_1k/sky130_sram_1kbyte_1rw1r_32x256_8_TT_1p8V_25C.lib
          test -s macros/sky130_1k/sky130_sram_1kbyte_1rw1r_32x256_8.gds
          echo "=== CPU ==="
          nproc
          echo "=== MEMORY ==="
          free -h
          mem_kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          echo "[RUNNER] MemTotal=${mem_kib} KiB"
          if (( mem_kib < 14 * 1024 * 1024 )); then
            echo "[FAIL] This ASIC synthesis needs a runner with at least 14 GiB RAM."
            echo "[INFO] Public ubuntu-24.04 runners provide 16 GB; standard private-repo runners provide 8 GB."
            exit 1
          fi
          echo "[RUNNER] Memory preflight PASS (>=14 GiB)"
          echo "=== DISK ==="
          df -h . "$RUNNER_TEMP"
          echo "=== DOCKER ==="
          docker version
          docker info

      - name: Prepare V1.18 for GitHub-hosted runner
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          # The uploaded V1.18 source archive references this ABC file,
          # but the file was absent from the archive. Recreate the intended
          # quick ABC mapping script (strash; map).
          mkdir -p config
          printf 'strash\nmap\n' > config/v118_abc_quick.script

          # The pinned ORFS commit uses mem_dump.py from synth.tcl to enforce
          # SYNTH_MEMORY_MAX_BITS. It does NOT ship memories/max_bits.tcl or a
          # synth_memory_max_bits Tcl procedure. Remove the stale line if a
          # previous manual patch added it.
          python3 - <<'PY_CLEAN'
          from pathlib import Path
          p = Path("config/v118_synth_preamble.tcl")
          lines = p.read_text().splitlines()
          stale = "source $::env(SCRIPTS_DIR)/memories/max_bits.tcl"
          kept = [line for line in lines if line.strip() != stale]
          if len(kept) != len(lines):
              p.write_text("\n".join(kept) + "\n")
              print("[FIX] Removed unsupported memories/max_bits.tcl source from custom preamble")
          else:
              print("[OK] Custom preamble has no unsupported max_bits Tcl source")
          PY_CLEAN

          # V1.18's original runner used a WSL/Windows-specific /mnt/d path.
          # Replace it with the temporary directory provided by GitHub Actions.
          mkdir -p "$RUNNER_TEMP/ASIC_WORK/V118/tmp"
          python3 - <<'PY'
          from pathlib import Path
          import os

          runner = Path("scripts/run_v117_nearfull_gds.sh")
          source = runner.read_text()
          old = "/mnt/d/ASIC_WORK/V118/tmp"
          new = os.path.join(os.environ["RUNNER_TEMP"], "ASIC_WORK/V118/tmp")
          if old in source:
              source = source.replace(old, new)
              runner.write_text(source)
              print(f"[PATCH] Docker TMP mount: {old} -> {new}")
          elif new in source:
              print("[OK] Docker TMP mount already points to RUNNER_TEMP")
          else:
              raise SystemExit("[FAIL] Could not identify the V1.18 temporary-directory mount")
          PY

          # Pin runner invocations to the same ORFS image used by this workflow.
          python3 - <<'PY_IMAGE'
          from pathlib import Path
          import os
          p = Path("scripts/run_v117_nearfull_gds.sh")
          s = p.read_text()
          old = "openroad/orfs:latest"
          new = os.environ["ORFS_IMAGE"]
          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
              print(f"[PATCH] ORFS image: {old} -> {new}")
          elif new in s:
              print(f"[OK] ORFS image already pinned: {new}")
          else:
              raise SystemExit("[FAIL] Could not identify ORFS image reference in runner")
          PY_IMAGE

          # Apply the source-provided V1.18 ABC/timeout patch and verify it.
          python3 scripts/v118_apply_fast_abc.py
          grep -q 'export ABC_SCRIPT := /workspace/config/v118_abc_quick.script' config/config_v117_nearfull_compute.mk
          grep -q 'strash' config/v118_abc_quick.script
          grep -q '^map$' config/v118_abc_quick.script

          # This design has millions of instances and hundreds of thousands of
          # reported setup endpoints. Do not run aggressive pre-placement timing
          # repair during floorplan; keep timing analysis/reporting enabled.
          python3 - <<'PY_FP'
          from pathlib import Path
          p = Path("config/config_v117_nearfull_compute.mk")
          lines = p.read_text().splitlines()
          lines = [line for line in lines if not line.strip().startswith("export SKIP_FLOORPLAN_REPAIR_TIMING")]
          lines.append("export SKIP_FLOORPLAN_REPAIR_TIMING := 1")
          p.write_text("\n".join(lines) + "\n")
          print("[PATCH] SKIP_FLOORPLAN_REPAIR_TIMING=1 (skip early repair; keep STA metrics)")
          PY_FP

          # The previous 15-minute floorplan timeout caused make to receive
          # SIGTERM, followed by SIGKILL after the 90-second grace period.
          # Give floorplan and final physical implementation realistic limits.
          python3 - <<'PY_TIMEOUT'
          from pathlib import Path
          p = Path("scripts/run_v117_nearfull_gds.sh")
          s = p.read_text()
          old = 'case "$stage" in floorplan) limit_sec=900;; finish) limit_sec=1800;; esac'
          new = 'case "$stage" in floorplan) limit_sec=3600;; finish) limit_sec=5400;; esac'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("[FAIL] Could not identify floorplan/finish timeout settings")
          p.write_text(s)
          print("[PATCH] Stage timeout: floorplan=3600s, finish=5400s")
          PY_TIMEOUT
          grep -q '^export SKIP_FLOORPLAN_REPAIR_TIMING := 1$' config/config_v117_nearfull_compute.mk
          grep -q 'floorplan) limit_sec=3600;; finish) limit_sec=5400;;' scripts/run_v117_nearfull_gds.sh

          # The original V1.17 runner capped OpenROAD containers at 6 GiB
          # (and the ODB audit at 3 GiB). The previous synth_odb link_design
          # reached 6,327,128 KB and failed under the 6 GiB cap. Raise both caps on a 16 GB runner.
          python3 - <<'PY_MEM'
          from pathlib import Path
          p = Path("scripts/run_v117_nearfull_gds.sh")
          s = p.read_text()
          s = s.replace("--memory=6g", "--memory=12g")
          s = s.replace("--memory=3g", "--memory=12g")
          if s.count("--memory=12g") != 2:
              raise SystemExit("[FAIL] Expected both OpenROAD memory limits to be raised to 12 GiB")
          s = s.replace("timeout -s TERM -k 90s \"$limit_sec\" docker run --rm --memory=12g --name",
                        "timeout -s TERM -k 90s \"$limit_sec\" docker run --memory=12g --name")
          if "docker run --memory=12g --name" not in s:
              raise SystemExit("[FAIL] Could not preserve stage container for OOM diagnostics")
          marker = ' wait "$pid" || rc=$?\n trap - INT TERM\n'
          insert = (' wait "$pid" || rc=$?\n'
                    ' if docker inspect "$name" >/dev/null 2>&1; then\n'
                      '  docker inspect --format "[DOCKER] Status={{.State.Status}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}" "$name" || true\n'
                    '  docker rm -f "$name" >/dev/null 2>&1 || true\n'
                    ' fi\n'
                    ' trap - INT TERM\n')
          if marker in s:
              s = s.replace(marker, insert, 1)
          elif "[DOCKER] Status={{.State.Status}} OOMKilled={{.State.OOMKilled}}" not in s:
              raise SystemExit("[FAIL] Could not add OOM diagnostics after stage execution")
          p.write_text(s)
          print("[PATCH] OpenROAD container memory: stage/audit=12 GiB")
          print("[PATCH] Stage container OOMKilled/exit status diagnostics enabled")
          PY_MEM

      - name: Restore sv2v v0.0.13 and Stack build cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.locate.outputs.project_dir }}/.tools/sv2v/v0.0.13/sv2v
            ~/.stack
          key: ubuntu-24.04-sv2v-v0.0.13-stack-2.15.5

      - name: Try cached or official sv2v v0.0.13 binary
        id: sv2v_prebuilt
        continue-on-error: true
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          cached=".tools/sv2v/v0.0.13/sv2v"
          if [[ -x "$cached" ]]; then
            echo "[CACHE] Reusing $cached"
            "$cached" --version
          else
            # The upstream release asset may temporarily return HTTP 502/504.
            # This step is allowed to fail; the next steps build the same pinned
            # sv2v tag from source instead of aborting the ASIC job.
            python3 scripts/v111_install_sv2v.py
            test -x "$cached"
            "$cached" --version
          fi

      - name: Setup Stack for sv2v source-build fallback
        if: steps.sv2v_prebuilt.outcome == 'failure'
        uses: haskell-actions/setup@v2.12.1
        with:
          enable-stack: true
          stack-version: '2.15.5'
          stack-no-global: true

      - name: Build pinned sv2v v0.0.13 from upstream source
        if: steps.sv2v_prebuilt.outcome == 'failure'
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/sv2v-v0.0.13-src"
          rm -rf "$src"
          echo "[INFO] Cloning exact upstream sv2v tag v0.0.13"
          git clone --depth 1 --branch v0.0.13 \
            https://github.com/zachjs/sv2v.git "$src"
          echo "[INFO] Building sv2v with upstream Stack/Makefile"
          make -C "$src" sv2v
          install -D -m 0755 "$src/bin/sv2v" .tools/sv2v/v0.0.13/sv2v
          .tools/sv2v/v0.0.13/sv2v --version
          echo "[OK] Built pinned sv2v into .tools/sv2v/v0.0.13/sv2v"

      - name: Verify SKY130HD target and sv2v frontend
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -x .tools/sv2v/v0.0.13/sv2v
          .tools/sv2v/v0.0.13/sv2v --version
          grep -Eq '^export PLATFORM[[:space:]]*=[[:space:]]*sky130hd([[:space:]]|$)' config/config.mk
          grep -q 'include /workspace/config/config_v116_nearfull_compute.mk' config/config_v117_nearfull_compute.mk
          echo '[PDK] Confirmed PLATFORM=sky130hd (SkyWater SKY130HD)'
          echo '[FRONTEND] sv2v v0.0.13 ready'

      - name: Pull OpenROAD Flow Scripts image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$ORFS_IMAGE"
          docker run --rm --entrypoint bash "$ORFS_IMAGE" -lc '\
            set -euo pipefail; \
            root=/OpenROAD-flow-scripts; \
            for f in "$root/env.sh" "$root/flow/Makefile" "$root/flow/scripts/synth.tcl" "$root/flow/scripts/mem_dump.py"; do \
              test -s "$f" || { echo "[FAIL] Missing expected ORFS file: $f"; exit 1; }; \
              echo "[ORFS] OK $f"; \
            done; \
            grep -n "mem_dump.py" "$root/flow/scripts/synth.tcl" | head -n 3; \
            if grep -R -n "synth_memory_max_bits" "$root/flow/scripts" >/tmp/orfs-helper-search.txt 2>/dev/null; then \
              echo "[ORFS] Found legacy/custom Tcl helper reference:"; cat /tmp/orfs-helper-search.txt; \
            else \
              echo "[ORFS] No synth_memory_max_bits Tcl procedure in this revision; memory limit is enforced through mem_dump.py."; \
            fi'
          echo "[ORFS] Verified standard Yosys memory-check flow in $ORFS_IMAGE"

      - name: Select flow mode
        id: mode
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          else
            mode="synth"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Selected ASIC flow mode: $mode"

      - name: Run V1.18 ASIC flow
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -o pipefail
          echo "[CI] Starting V1.18 flow: ${{ steps.mode.outputs.mode }}"
          bash scripts/run_v117_nearfull_gds.sh "${{ steps.mode.outputs.mode }}"

      - name: Add report to workflow summary
        if: always()
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          report="output/v117_nearfull/BAO_CAO_V117.md"
          status="output/v117_nearfull/status.txt"
          {
            echo "## V1.18 ASIC Flow"
            echo "**Target PDK:** SkyWater SKY130HD (ORFS platform: \`sky130hd\`)"
            if [[ -s "$status" ]]; then
              echo "**Status:** \`$(cat "$status")\`"
            else
              echo "**Status:** no status file was generated"
            fi
            if [[ -s "$report" ]]; then
              cat "$report"
            else
              echo "The detailed Markdown report was not generated. Check the uploaded logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ASIC reports, logs, and physical outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v118-asic-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ steps.locate.outputs.project_dir }}/output/v117_nearfull/status.txt
            ${{ steps.locate.outputs.project_dir }}/output/v117_nearfull/BAO_CAO_V117.md
            ${{ steps.locate.outputs.project_dir }}/output/v117_nearfull/*.log
            ${{ steps.locate.outputs.project_dir }}/output/v117_nearfull/reports/**
            ${{ steps.locate.outputs.project_dir }}/output/v117_nearfull/logs/**
            ${{ steps.locate.outputs.project_dir }}/output/v117_nearfull/results/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
