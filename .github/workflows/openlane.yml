name: OpenLane ASIC Flow

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build_gds:
    runs-on: ubuntu-22.04
    
    env:
      PDK_ROOT: ${{ github.workspace }}/pdk
      PDK: sky130A
      STD_CELL_LIBRARY: sky130_fd_sc_hd

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          update-environment: true
        env:
          ACTIONS_CACHE_URL: ${{ env.ACTIONS_CACHE_URL }}
          ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}

      - name: Cache PDK
        id: cache-pdk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/pdk
          key: pdk-${{ env.PDK }}-${{ hashFiles('**/config.json') }}
          restore-keys: |
            pdk-${{ env.PDK }}-

      - name: Install Volare and Download PDK
        if: steps.cache-pdk.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install volare
          export PDK_ROOT=${{ github.workspace }}/pdk
          # Truyền token trực tiếp vào volare để tránh lỗi không tìm thấy oauth token
          volare enable --pdk sky130A --pdk-root ${{ github.workspace }}/pdk --token ${{ secrets.GITHUB_TOKEN }} 0da63c56d090d565651f893f1bc5211910bc49bf

      - name: Verify PDK Installation
        run: |
          ls -l ${{ github.workspace }}/pdk/sky130A/libs.ref/sky130_fd_sc_hd

      - name: Run OpenLane Synthesis & Place-Route
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -v ${{ github.workspace }}/pdk:/build/pdk \
            -v /dev/shm:/dev/shm \
            -e PDK_ROOT=/build/pdk \
            -e PDK=${{ env.PDK }} \
            -e STD_CELL_LIBRARY=${{ env.STD_CELL_LIBRARY }} \
            efabless/openlane:2023.11.23 \
            flow.tcl -design /work/V118_ASIC_SOURCE/work

      - name: Zip and Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openlane-results
          path: |
            runs/
            V118_ASIC_SOURCE/work/runs/
